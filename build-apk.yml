                          val media = Dlna.probe(url)
                          switchGuard = System.currentTimeMillis() + 6000
                          Proxy.cast(applicationContext, tv, url, media, title, 0, false)
                          curMedia = media; curTitle = title; softPaused = false
                          currentTv = tv
