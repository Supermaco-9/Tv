                      val pm = getSystemService(POWER_SERVICE) as PowerManager
                      val prefs = getSharedPreferences("tvsender_prefs", MODE_PRIVATE)
                      if (!pm.isIgnoringBatteryOptimizations(packageName) && !prefs.getBoolean("asked_battery", false)) {
