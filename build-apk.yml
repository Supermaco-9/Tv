              private fun seekTo(sec: Int) {
                  val m = curMedia
                  val s = Proxy.current
                  if (m != null && m.hls && s != null && Proxy.totalSec > 0) {
                      // Se crea una sesión nueva; la anterior sigue viva hasta que el TV pide la nueva,
                      // así el TV nunca recibe un "fin de video" (que era lo que lo sacaba de la reproducción)
                      switchGuard = System.currentTimeMillis() + 6000
                      control("Adelantar") { tv ->
                          Proxy.cast(applicationContext, tv, s.target, m, curTitle, sec, true)
                          softPaused = false
                          runOnUiThread { paused = false; playPause.text = "⏸ Pausa" }
                      }
                  } else {
                      control("Adelantar") { Dlna.seek(it, sec) }
                  }
              }

              private fun seekBy(delta: Int) {
                  val target = (lastPos + delta).coerceIn(0, if (lastDur > 0) lastDur else Int.MAX_VALUE)
                  seekTo(target)
              }

              private fun toggleMute() {
                  muted = !muted
                  val m = muted
                  control("Silencio") { Dlna.setMute(it, m) }
                  muteBtn.text = if (m) "🔊 Quitar silencio" else "🔇 Silenciar"
              }

              private fun startPolling() {
                  if (polling) return
                  polling = true
                  thread(isDaemon = true) {
                      while (polling) {
                          val t = currentTv
                          val sess = Proxy.current
                          if (t != null && sess != null) {
                              val info = runCatching { Dlna.position(t) }.getOrNull()
                              // Solo se confía en la posición cuando el TV ya está en la sesión actual
                              val fresh = info != null && (System.currentTimeMillis() > switchGuard ||
                                      (info.uri.isNotBlank() && info.uri.contains("/s${sess.token}.")))
                              if (info != null && fresh) {
                                  val vod = sess.isHls && Proxy.totalSec > 0
                                  val pos = if (vod) (sess.startSec + info.pos).coerceAtMost(Proxy.totalSec) else info.pos
                                  val dur = if (vod) Proxy.totalSec else info.dur
                                  lastPos = pos
                                  lastDur = dur
                                  runOnUiThread {
                                      if (!dragging) {
                                          seek.max = dur.coerceAtLeast(0)
                                          seek.progress = pos.coerceAtMost(seek.max)
                                      }
                                      seek.isEnabled = dur > 0
                                      timeLabel.text = if (dur > 0) "${fmt(pos)} / ${fmt(dur)}"
                                      else "${fmt(pos)} · EN VIVO"
                                  }
                              }
                          }
                          Thread.sleep(1000)
                      }
                  }
              }

              private fun fmt(sec: Int): String {
                  val h = sec / 3600
                  val m = (sec % 3600) / 60
                  val s = sec % 60
                  return if (h > 0) "%d:%02d:%02d".format(h, m, s) else "%d:%02d".format(m, s)
              }

